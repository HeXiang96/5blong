# =============================================================================
# 5blong 自建 TURN（coturn）
# =============================================================================
# 为什么自己搭：原来用 turn.cloudflare.com，那台在洛杉矶，中继单程约 200ms。
# 这台机器在香港，到国内 20–41ms —— 打洞失败的人走中继时，体验差 5 倍。
#
# 三个必须成对出现的配置（改错任一个都会「看起来正常但中继不通」）：
#   1. external-ip  —— 阿里云是 1:1 NAT，网卡上只有 172.22.x 的私网地址。
#      不写 external-ip 的话，coturn 会把私网地址当候选发给客户端，谁都连不上。
#   2. min-port/max-port —— 中继实际收发用的端口范围，**必须和安全组放行的一致**。
#   3. use-auth-secret + static-auth-secret —— 凭据由 /ice 用同一个密钥现签，
#      不在本机存任何用户表。
# =============================================================================

# ── 监听 ─────────────────────────────────────────────────────────────────────
listening-port=3478
tls-listening-port=5349
# 公网 IP / 私网 IP：前者发给客户端，后者是本机实际绑定的地址
external-ip=__PUBLIC_IP__/__PRIVATE_IP__
# 只允许 lo 与本机网卡，避免监听在意外接口上
listening-ip=__PRIVATE_IP__
relay-ip=__PRIVATE_IP__

# ── 中继端口范围 ─────────────────────────────────────────────────────────────
# 每个中继会话占 2 个端口。1000 个端口够 ~500 路并发中继，
# 按 13 人房最多 12 路算，够 40 个满员房同时走中继。
# ⚠️ 改这里必须同步阿里云安全组（UDP 50000/50999）。
min-port=50000
max-port=50999

# ── 认证：TURN REST API（与 server/src/ice.mjs 配对） ────────────────────────
# username = "<过期时间戳秒>:<标签>"，credential = base64(HMAC-SHA1(secret, username))
use-auth-secret
static-auth-secret=__TURN_SECRET__
realm=5blong.site
server-name=5blong.site

# ── TLS（turns:5349） ───────────────────────────────────────────────────────
# 公司网/校园网常把 UDP 全封，只放 443 出去。走 TLS 是最后一条退路。
# 证书由 Let's Encrypt 续期钩子复制到这里（见 deploy/letsencrypt-hook.sh）。
cert=/etc/coturn/fullchain.pem
pkey=/etc/coturn/privkey.pem
no-tlsv1
no-tlsv1_1

# ── 容量与防滥用 ─────────────────────────────────────────────────────────────
# 单用户最多 12 路（一个满员房的上限），总量 1200 路
user-quota=12
total-quota=1200
# 单会话不设带宽上限：语音只有 64kbps，限了反而伤音质
stale-nonce=600
# 会话超时：断了的中继 10 分钟回收，别让端口泄漏
max-allocate-lifetime=3600
channel-lifetime=600
permission-lifetime=300

# ── 安全 ─────────────────────────────────────────────────────────────────────
# 不允许中继到内网/保留地址：否则这个服务会被当成跳板去打云内网
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
# 本机自己的中继地址要允许（它落在 172.22 的私网段里，会被上面那条误伤）
allowed-peer-ip=__PRIVATE_IP__

# ── 日志与运行 ───────────────────────────────────────────────────────────────
# 关掉交互式 CLI：这个端口对外，开 CLI 等于给一个无密码的管理入口
no-cli
# 日志走 journald（systemd 统一收集），排查时用 journalctl -u coturn
log-file=stdout
simple-log
