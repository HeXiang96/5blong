# 5blong · nginx 配置
#
# 关键决定：**静态站也放在这台机器上**，不拆到 EdgeOne Pages。
#
# 原因（踩过就知道）：
#   前端在 5blong.site、接口在 api.5blong.site 就是**跨站**，
#   而登录 cookie 是 SameSite=Lax —— 跨站不带 cookie，所有人会掉登录。
#   把静态和接口放在同一个域名下，这个问题根本不存在，也不需要写反代函数。
#
# 639KB 的主包从香港直出（国内 37ms），比绕去 EdgeOne 再回源还少一跳。
# 以后真需要 CDN，把 EdgeOne 的 CDN 模式套在这台机器前面即可（源站不变）。

# WebSocket 升级头：PeerJS 长连接必需，缺了就是握手 400
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP → HTTPS。certbot 的 acme 挑战必须留在 80 上
server {
    listen 80;
    listen [::]:80;
    server_name 5blong.site www.5blong.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.18（Ubuntu 22.04 自带）不认 `http2 on;` 这个新指令，
    # 必须在 listen 上带 http2。1.25.1+ 才支持新写法（旧写法会告警）。
    # 这台服务器是 1.18，所以用下面这个写法。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 5blong.site www.5blong.site;

    # ── 证书（certbot 会自动写这两行，首次签发后由它维护） ──────────────
    ssl_certificate     /etc/letsencrypt/live/5blong.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5blong.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # 麦克风要求安全上下文，HSTS 顺手开上
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ── 静态站 ────────────────────────────────────────────────────────────
    root  /var/www/5blong;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的资源：永久缓存。这是"第二次打开秒开"的关键。
    # 主包 639KB，跨太平洋时最贵的就是它。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能长缓存，否则发版后用户一直拿旧版本
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 桌面端更新清单同理：缓存了客户端就检测不到新版本
    location = /desktop/latest.json {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA 回退：/reset、/admin 这类路径没有实体文件，交给 index.html 的路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 账号接口 ──────────────────────────────────────────────────────────

    # ── 后台页面（服务端渲染的 HTML，必须转给接口，不能落到静态兜底） ──────
    # 漏了这一条的表现：打开 /admin 看到的是首页（index.html），以为后台没了。
    # ── 屏幕共享 SFU 代理 ────────────────────────────────────────────────
    # 只做转发 + 补 Bearer 密钥，SFU 服务仍在 Cloudflare。
    # 必须单独一条：漏了会落到 SPA 兜底，客户端拿到 index.html，
    # 报错是 "Unexpected token '<'"，很难看出是被静态页截住了。
    location /sfu/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SDP 可能几百 KB，默认 60 秒读超时在弱网下会断
        proxy_read_timeout 120s;
    }

    location ~ ^/(admin|accounts-admin|rooms|rooms/export|reset|game-admin|game/entitle|game/verify)$ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 应用内反馈提交（桌面端跨域会先发 OPTIONS）
    location = /feedback {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 头像上传是 dataURL，给足请求体
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    # TURN 凭据：必须精确匹配（客户端请求的就是 /ice）
    location = /ice {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查：只允许本机看，别把内部信息暴露到公网
    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8788;
    }

    # ── 账号收件箱（推送） ────────────────────────────────────────────────
    # 必须 **精确匹配** 且在 /peerjs 前面：nginx 里 `= /peerjs/inbox` 优先级高于
    # 前缀 `/peerjs`，所以即使写在后面也会先命中这条。
    # 漏了这条的表现：收件箱连到信令进程，PeerJS 不认这个路径，红点永远不来，
    # 而且客户端只会安静地退化成轮询，看不出错。
    location = /peerjs/inbox {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 常驻连接：客户端 25 秒一次心跳，这里给足余量
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ── PeerJS 信令（WebSocket） ──────────────────────────────────────────
    location /peerjs {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 信令是长连接：默认 60 秒会被掐断，房主挂机一会儿就掉
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
