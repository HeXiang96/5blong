# 5blong · nginx 配置（2026-11-03：拆成「介绍页」「网页版应用」「下载」三个域名）
#
# 域名分工：
#   5blong.site      → 介绍页（静态）+ 桌面端更新源 /desktop/ + 全部接口
#   web.5blong.site  → 网页版应用（SPA），并反代同一套接口
#   dl.5blong.site   → 只服务 /desktop/（安装包下载），解析到阿里云 GA 加速 IP
#   www.5blong.site  → 与主域同内容
#
# 为什么接口要两边都反代（而不是让 web 去打 5blong.site）：
#   登录 cookie 是 SameSite=Lax，从 web. 子域请求主域接口属于跨站，cookie 不带，
#   表现是"登录成功但每个请求都是未登录"。同源反代是唯一不碰后端的解法。
#
# 关键决定（历史）：**静态站也放在这台机器上**，不拆到 EdgeOne/CF Pages。
#   跨站部署必须写反代 + 改 cookie 语义，得不偿失；香港直出国内也就 30–40ms。

# WebSocket 升级头：PeerJS 长连接必需，缺了就是握手 400
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}


# ---------------------------------------------------------------- 80（跳转 + ACME）
# certbot 的 acme 挑战必须留在 80 上，且所有域名都要在这里认出自己，
# 否则签发/续期会落到别的 server 块、404 掉。
server {
    listen 80;
    listen [::]:80;
    server_name 5blong.site www.5blong.site web.5blong.site dl.5blong.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------- 主站：介绍页
server {
    # nginx 1.18（Ubuntu 22.04 自带）不认 `http2 on;` 这个新指令，
    # 必须在 listen 上带 http2。1.25.1+ 才支持新写法（旧写法会告警）。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 5blong.site www.5blong.site;

    ssl_certificate     /etc/letsencrypt/live/5blong.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5blong.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_session_timeout 1d;

    # 麦克风要求安全上下文，HSTS 顺手开上
    add_header Strict-Transport-Security "max-age=31536000" always;

    root  /var/www/5blong;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # 介绍页没有带哈希的 assets，这条是给以后加图留的
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能长缓存，否则改了介绍页用户一直看旧的
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # 桌面端更新清单：缓存了客户端就检测不到新版本
    location = /desktop/latest.json {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # 安装包本体：找不到就 404，别回落到 index.html（否则下载到一个 HTML）
    location /desktop/ {
        try_files $uri =404;
    }

    # 老路径兜底：以前有人把 /app 当入口，统一送到 web 子域
    location = /app {
        return 301 https://web.5blong.site/;
    }

    # 介绍页自身的静态文件；未知路径也给首页（避免 404 太硬）
    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/snippets/5blong-proxy.conf;
}

# ---------------------------------------------------------------- web 子域：应用
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.5blong.site;

    ssl_certificate     /etc/letsencrypt/live/5blong.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5blong.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 应用产物由 CI 打包，服务器上的 5blong-web-sync 定时器拉到这下面。
    # 注意：绝不能和 desktop/ 混在一起——那是主域的更新源。
    root  /var/www/5blong/app;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 带内容哈希的资源：永久缓存。这是"第二次打开秒开"的关键。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html 绝不能长缓存，否则发版后用户一直拿旧版本
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # SPA 回退：邀请链接是 /#c=... 走 fragment，不需要服务端路由，
    # 但保留兜底，避免直接访问 /xxx 时 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    include /etc/nginx/snippets/5blong-proxy.conf;
}

# ---------------------------------------------------------------- dl 子域：只服务下载
#
# 这个域名的 A 记录指向**阿里云 GA 加速 IP**，不是本机公网 IP。
# 链路：用户 → GA 就近接入点（华东/华南）→ 阿里云骨干 → 香港本机 nginx。
#
# 为什么单独开一个子域而不是把主域也指到 GA：
#   GA 按跨境流量计费。主域上有首页、/api、/desktop/latest.json，
#   最贵的是 7.5MB 的安装包——但接口和页面本来就不慢（170~260ms），
#   没必要为它们付跨境带宽钱。分开之后"贵的流量走加速，便宜的走直连"。
#
# 为什么这里**只放行 /desktop/**：
#   1. 避免 dl 变成一个能访问整站的镜像（SEO 重复内容、也不好多一层入口）
#   2. 万一哪天 GA 配置挂错指向别处，也只会漏掉下载，不会漏掉接口
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dl.5blong.site;

    ssl_certificate     /etc/letsencrypt/live/5blong.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/5blong.site/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_session_timeout 1d;

    root /var/www/5blong;

    # 清单：几百字节，绝不能缓存（缓存了就检测不到新版本）
    location = /desktop/latest.json {
        add_header Cache-Control "no-store, must-revalidate";
        try_files $uri =404;
    }

    # 安装包本体：找不到就 404，别回落到别的东西
    location /desktop/ {
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
