# 5blong · nginx 配置（**HTTP 临时版**）
#
# 用途：域名还没解析过来、证书还没签下来时的过渡配置。
# 只有一个 80 端口，不做跳转、不开 TLS —— 因为它要跑得起来，证书才有机会被签。
#
# 顺序（别弄反）：
#   1. 用这份配置把 80 跑起来（能访问 http://IP/ 看到页面）
#   2. 域名解析到本机 → certbot --nginx -d 域名 签证书
#   3. 换成正式的 nginx.conf（带 443 + 强制跳转），reload
#
# 换成正式版之后，这个文件就可以删了。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root  /var/www/5blong;
    index index.html;

    # 保留给 certbot 的 webroot 验证留个位置
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }


    # ── 后台页面（服务端渲染的 HTML，必须转给接口，不能落到静态兜底） ──────
    # 漏了这一条的表现：打开 /admin 看到的是首页（index.html），以为后台没了。
    # ── 屏幕共享 SFU 代理 ────────────────────────────────────────────────
    # 只做转发 + 补 Bearer 密钥，SFU 服务仍在 Cloudflare。
    # 必须单独一条：漏了会落到 SPA 兜底，客户端拿到 index.html，
    # 报错是 "Unexpected token '<'"，很难看出是被静态页截住了。
    location /sfu/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SDP 可能几百 KB，默认 60 秒读超时在弱网下会断
        proxy_read_timeout 120s;
    }

    location ~ ^/(admin|accounts-admin|rooms|rooms/export|reset|game-admin|game/entitle|game/verify)$ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 应用内反馈提交（桌面端跨域会先发 OPTIONS）
    location = /feedback {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 2m;
        proxy_read_timeout 30s;
    }

    location = /ice {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8788;
    }

    # 账号收件箱（推送）：精确匹配优先于前缀 /peerjs，转到接口进程
    location = /peerjs/inbox {
        proxy_pass http://127.0.0.1:8788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location /peerjs {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
