# 5blong 的接口反代片段（2026-11-03 抽出来，5blong.site 与 web.5blong.site 共用）
#
# 为什么要共用：网页版应用在 web.5blong.site，接口在 8788 上。如果让页面跨子域
# 去打 5blong.site/api，浏览器会按跨站处理，SameSite=Lax 的会话 cookie 不会被带上，
# 结果是"登录了但每个请求都是未登录"。
# 让 web 子域自己也反代同一套接口，页面与接口同源，cookie 正常，后端一行不用改。

# ── 屏幕共享 SFU 代理 ────────────────────────────────────────────────
# 只做转发 + 补 Bearer 密钥，SFU 服务仍在 Cloudflare。
# 必须单独一条：漏了会落到 SPA 兜底，客户端拿到 index.html，
# 报错是 "Unexpected token '<'"，很难看出是被静态页截住了。
location /sfu/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SDP 可能几百 KB，默认 60 秒读超时在弱网下会断
    proxy_read_timeout 120s;
}

# ── 后台页面（服务端渲染的 HTML，必须转给接口，不能落到静态兜底） ──────
# 漏了这一条的表现：打开 /admin 看到的是首页（index.html），以为后台没了。
location ~ ^/(admin|accounts-admin|rooms|rooms/export|reset|game-admin|game/entitle|game/verify)$ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 应用内反馈提交（桌面端跨域会先发 OPTIONS）
location = /feedback {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 头像上传是 dataURL，给足请求体
    client_max_body_size 2m;
    proxy_read_timeout 30s;
}

# TURN 凭据：必须精确匹配（客户端请求的就是 /ice）
location = /ice {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# 健康检查：只允许本机看，别把内部信息暴露到公网
location = /healthz {
    allow 127.0.0.1;
    deny all;
    proxy_pass http://127.0.0.1:8788;
}

# ── 账号收件箱（推送） ────────────────────────────────────────────────
# 必须 **精确匹配** 且在 /peerjs 前面：nginx 里 `= /peerjs/inbox` 优先级高于
# 前缀 `/peerjs`，所以即使写在后面也会先命中这条。
# 漏了这条的表现：收件箱连到信令进程，PeerJS 不认这个路径，红点永远不来，
# 而且客户端只会安静地退化成轮询，看不出错。
location = /peerjs/inbox {
    proxy_pass http://127.0.0.1:8788;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 常驻连接：客户端 25 秒一次心跳，这里给足余量
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

# ── PeerJS 信令（WebSocket） ──────────────────────────────────────────
location /peerjs {
    proxy_pass http://127.0.0.1:9000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 信令是长连接：默认 60 秒会被掐断，房主挂机一会儿就掉
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}
