<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>probe</title></head><body>
<pre id="log">start</pre>
<script>
  const log = (msg) => { document.getElementById("log").textContent += "\n" + msg; document.title = "LOGGED"; };
  try {
    const c = document.createElement("canvas");
    const gl = c.getContext("webgl2") || c.getContext("webgl");
    log("webgl: " + (gl ? "OK " + gl.getParameter(gl.VERSION) : "NULL"));
    if (gl) log("renderer: " + gl.getParameter(gl.RENDERER));
    import("/node_modules/three/build/three.module.js")
      .then((m) => log("three import: OK " + (m.REVISION || "?")))
      .catch((e) => log("three import FAIL: " + e));
    fetch("/3d.glb", { method: "GET" })
      .then((r) => log("glb fetch: " + r.status + " len=" + r.headers.get("content-length")))
      .catch((e) => log("glb fetch FAIL: " + e));
  } catch (err) { log("EXC " + err); }
</script>
</body></html>
