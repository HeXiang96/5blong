# 屏幕共享 Worker（生产环境；本地验证走 scripts/dev-sfu-server.mjs，不需要它）
name = "5blong-sfu"
main = "index.js"
compatibility_date = "2026-10-01"

# 密钥用 wrangler secret 配置，绝不写进本文件：
#   wrangler secret put SFU_APP_ID
#   wrangler secret put SFU_APP_SECRET

# 发布登记表（防串流）：全局单例 Durable Object
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "PublicationRegistry"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PublicationRegistry"]
