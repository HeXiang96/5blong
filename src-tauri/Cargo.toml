[package]
name = "app"
version = "1.9.2"
description = "5blong 桌面端（Tauri 壳：托盘常驻 + 单实例 + 关窗驻留）"
authors = ["5blong"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "5blong"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
# 自动更新：从 GitHub Releases 拉取 latest.json，校验 minisign 签名后静默安装。
tauri-plugin-updater = "2"
# 原生消息框（发现新版本 / 检查结果提示），Rust 侧直接调用，无需前端授权。
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
# WebView2：自动授予麦克风等媒体权限，避免系统权限条打断“开聊”。
# 版本与 Tauri 内部使用的 webview2-com 保持一致。
webview2-com = "0.39"
# 内置系统声音采集（WASAPI 回环）：浏览器在多声道（7.1/8ch）播放设备上拿不到
# 系统音频（Chromium 对回环端点格式挑剔），客户端在 Rust 侧自己采（同 Oopz 的做法）。
wasapi = "0.14"
# 进程级系统声音采集（共享桌面时排除本应用，避免房间语音被采两遍）
windows-core = "0.62"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Threading",
  # 共享声音：枚举窗口找被共享的进程（EnumWindows）+ 枚举子进程找 WebView2
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Diagnostics_ToolHelp",
] }
base64 = "0.22"
