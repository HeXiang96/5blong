name: Release

# 触发方式二选一：
#   1. 推送 app-v* 标签（npm run bump 会自动做这件事）→ 出正式 Release；
#   2. 在 GitHub Actions 页面手动 Run workflow（不出 Release，仅验证构建）。
on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action：构建 NSIS 安装包 + 更新产物（*.exe.zip + .sig + latest.json），
      # 签名用仓库 Secrets 里的 TAURI_SIGNING_PRIVATE_KEY（密码为空串），
      # 全部资产连同 latest.json 一起发布到 GitHub Releases。
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: app-v__VERSION__
          releaseName: '5blong v__VERSION__'
          releaseBody: 'Windows 安装包（NSIS，免管理员）。桌面端会自动检查并提示更新；加入者用网页版无需安装。'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # 出包成功后，把更新源（exe + .sig + latest.json，下载地址改写为 pages.dev）
      # 直接从 runner 部署到 Cloudflare Pages /desktop/——runner 访问 GitHub 和
      # Cloudflare 都不需要代理，本机零操作。需要仓库 Secrets：
      #   CLOUDFLARE_API_TOKEN：权限 Account → Cloudflare Pages → Edit。
      # 未配置该 Secret 时跳过（可之后在本机手动 npm run publish:desktop）。
      - name: Publish desktop assets to Pages
        if: startsWith(github.ref, 'refs/tags/app-v')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "未配置 CLOUDFLARE_API_TOKEN，跳过 Pages 发布（可本机手动 npm run publish:desktop）"
            exit 0
          fi
          node scripts/publish-desktop.mjs "${GITHUB_REF_NAME#app-v}"
