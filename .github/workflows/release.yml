name: Release

# 触发方式二选一：
#   1. 推送 app-v* 标签（npm run bump 会自动做这件事）→ 出正式 Release；
#   2. 在 GitHub Actions 页面手动 Run workflow（不出 Release，仅验证构建）。
#
# 2026-11-03 起不再发布 Cloudflare Pages（业主已弃用）：
#   - 桌面更新源由 ECS 上的 5blong-desktop-sync.timer 主动来拉；
#   - 网页版产物打进 Release 资产 dist-web.tar.gz，由 5blong-web-sync.timer 来拉。
#   两条都是「服务器拉」，CI 里不需要存放任何服务器凭据。
on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Rust stable
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      # tauri-action：构建 NSIS 安装包 + 更新产物（*.exe.zip + .sig + latest.json），
      # 签名用仓库 Secrets 里的 TAURI_SIGNING_PRIVATE_KEY（密码为空串），
      # 全部资产连同 latest.json 一起发布到 GitHub Releases。
      # 仅 tag 推送时出包；手动触发（dispatch）时跳过，直接复用最新 Release。
      - name: Build and release
        if: startsWith(github.ref, 'refs/tags/app-v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: .
          tagName: app-v__VERSION__
          releaseName: '5blong v__VERSION__'
          releaseBody: 'Windows 安装包（NSIS，免管理员）。桌面端会自动检查并提示更新；加入者用网页版无需安装。'
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

      # 网页版产物：打成 dist-web.tar.gz 挂到同一个 Release 上。
      # 服务器上的 5blong-web-sync.timer 会每 5 分钟来拉一次，解开覆盖静态站
      # （保留 desktop/ 目录）。为什么不让 CI 直接 scp：那样必须把服务器私钥
      # 放进 GitHub Secrets，泄露即等于服务器被登。让服务器"主动拉"就没这个口子。
      - name: Build web bundle
        if: startsWith(github.ref, 'refs/tags/app-v')
        run: npm run build:web:pages

      - name: Upload web bundle to release
        if: startsWith(github.ref, 'refs/tags/app-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tar -czf dist-web.tar.gz -C dist-web .
          ls -lh dist-web.tar.gz
          gh release upload "$GITHUB_REF_NAME" dist-web.tar.gz --clobber
          echo "已上传 dist-web.tar.gz → $GITHUB_REF_NAME"
