# 临时探针（2026-11-03，验完即删）
#
# 目的：确认 **rustls** 能不能连上阿里云 GA 的加速 IP（dl.5blong.site）。
# 背景：Windows 原生 TLS（schannel）实测连不上；而 Tauri 的 updater 用的是
#       rustls（tauri-plugin-updater 默认 feature 就是 rustls-tls），
#       所以只有 rustls 本身的结果才算数。本机没有 MSVC 链接器，借 runner 跑。
# 判据：日志出现 PROBE_OK 即通过；PROBE_FAIL 表示这条路彻底不通。
name: probe-rustls

on:
  push:
    paths:
      - 'probe-rustls/**'
      - '.github/workflows/probe-rustls.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: rustls 连 dl（GA 加速 IP）
        shell: bash
        run: cargo run --manifest-path probe-rustls/Cargo.toml
